name: Deploy MegaDealz India to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions required for GitHub Actions Pages deployment and pushing to gh-pages branch
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Verify build output and prepare SPA fallbacks
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not generated by Vite build"
            exit 1
          fi
          # Ensure .nojekyll prevents Jekyll processing
          touch dist/.nojekyll
          # Ensure 404.html handles client-side routing refreshes
          cp dist/index.html dist/404.html
          echo "Production assets successfully generated in dist/:"
          ls -la dist/

      # 1. Direct deployment via GitHub Actions Pages (When Source is set to 'GitHub Actions')
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact from dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. Deploy to gh-pages branch (Fallback when Source is set to 'Deploy from a branch' -> gh-pages)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
